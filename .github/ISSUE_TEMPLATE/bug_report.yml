name: Bug report
description: Something in Pantheon isn't working as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in as much as you can.

        **Please do not paste real chat logs or personal data into this form.** Pantheon's whole premise is that your data stays local — keep it that way. Use the `/pantheon-demo` Wang family example to reproduce.
  - type: input
    id: command
    attributes:
      label: Which command?
      placeholder: e.g. /pantheon-talk father_wangjianguo
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Paste the relevant output. Redact any personal information.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: |
        Ideally use `/pantheon-demo` + the Wang family example so the bug is reproducible without your personal data.
      placeholder: |
        1. /pantheon-demo
        2. /pantheon-talk grandma_zhangxiuying
        3. Ask "你手疼不疼?"
        4. Observed: ...
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.7"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 14.3 / Ubuntu 22.04 / Windows 11"
    validations:
      required: true
  - type: input
    id: claude_code
    attributes:
      label: Claude Code version
      placeholder: "1.2.3"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not pasted any real chat logs, real names, or other personal data into this issue.
          required: true
